<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstrWeChat</title>
  <style>
    :root {
      --accent: #d4afc9;
      --ink: #050505;
      --border: rgba(212, 175, 201, 0.24);
      --muted: #a796a0;
      --text: #f4edf1;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
      -webkit-app-region: drag;
    }

    .splash {
      position: relative;
      width: 760px;
      height: 460px;
      overflow: hidden;
      padding: 34px 42px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--ink);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55);
      animation: splash-in 720ms cubic-bezier(.16, 1, .3, 1) both;
    }

    .splash::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .32;
      background-image: linear-gradient(rgba(212, 175, 201, .08) 1px, transparent 1px), linear-gradient(90deg, rgba(212, 175, 201, .08) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
      pointer-events: none;
    }

    .topline, .content, .footer { position: relative; z-index: 1; }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: fade-up 600ms 160ms both;
    }

    .brand-label {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
    }

    .version {
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 11px;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      animation: fade-up 700ms 240ms both;
    }

    .icon-stage {
      position: relative;
      width: 138px;
      height: 138px;
      display: grid;
      place-items: center;
    }

    .ring, .ring::after {
      position: absolute;
      border: 1px solid rgba(212, 175, 201, .42);
      border-radius: 50%;
      content: "";
    }

    .ring {
      width: 106px;
      height: 106px;
      animation: ring-pulse 2.4s ease-out infinite;
    }

    .ring::after {
      inset: -15px;
      opacity: .5;
      animation: ring-pulse 2.4s 800ms ease-out infinite;
    }

    .app-icon {
      width: 94px;
      height: 94px;
      object-fit: cover;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, .18);
      box-shadow: 0 12px 28px rgba(0, 0, 0, .45);
      animation: icon-float 3.4s ease-in-out infinite;
    }

    h1 {
      margin: 4px 0 0;
      color: var(--text);
      font-size: 30px;
      font-weight: 650;
      letter-spacing: .04em;
    }

    .status {
      min-height: 18px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .04em;
    }

    .footer { animation: fade-up 700ms 320ms both; }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .06em;
    }

    .percent { color: var(--accent); font-family: Consolas, monospace; }

    .progress-track {
      height: 4px;
      overflow: hidden;
      background: #241e22;
      border-radius: 99px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      border-radius: inherit;
      transition: width 360ms cubic-bezier(.16, 1, .3, 1);
    }

    .progress-fill.waiting {
      width: 38% !important;
      animation: loading-sweep 1.1s ease-in-out infinite;
    }

    .splash.complete { animation: splash-out 360ms ease-in both; }

    @keyframes splash-in {
      from { opacity: 0; transform: translateY(12px) scale(.975); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes splash-out { to { opacity: 0; transform: scale(.985); } }
    @keyframes fade-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes icon-float { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-7px) rotate(1deg); } }
    @keyframes ring-pulse { 0% { transform: scale(.82); opacity: .72; } 100% { transform: scale(1.35); opacity: 0; } }
    @keyframes loading-sweep { 0% { transform: translateX(-90%); } 100% { transform: translateX(260%); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <main class="splash" id="splash">
    <header class="topline">
      <span class="brand-label">ASTRWECHAT</span>
      <span class="version" id="versionText">STARTING</span>
    </header>

    <section class="content">
      <div class="icon-stage" aria-hidden="true">
        <span class="ring"></span>
        <img class="app-icon" src="icon.png" alt="">
      </div>
      <h1>AstrWeChat</h1>
      <div class="status" id="progressText">正在启动服务...</div>
    </section>

    <footer class="footer">
      <div class="progress-meta">
        <span id="phaseText">初始化</span>
        <span class="percent"><span id="percentNum">0</span>%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </footer>
  </main>

  <script>
    function updateProgress(percent, text, waiting) {
      var safePercent = Math.max(0, Math.min(100, Number(percent) || 0));
      var splash = document.getElementById('splash');
      var fill = document.getElementById('progressFill');
      var label = document.getElementById('progressText');
      var phase = document.getElementById('phaseText');
      var percentNum = document.getElementById('percentNum');

      if (fill) {
        fill.classList.toggle('waiting', Boolean(waiting));
        fill.style.width = waiting ? '38%' : safePercent + '%';
      }
      if (percentNum) percentNum.textContent = Math.round(safePercent);
      if (text) {
        if (label) label.textContent = text;
        if (phase) phase.textContent = text;
      }
      if (safePercent >= 100 && splash) splash.classList.add('complete');
    }

    (function bootstrapSplash() {
      var params = new URLSearchParams(window.location.search || '');
      var version = String(params.get('version') || '').replace(/^v/i, '');
      var versionText = document.getElementById('versionText');
      if (version && versionText) versionText.textContent = 'V' + version;
      updateProgress(0, '正在启动服务...', false);
    })();
  </script>
</body>
</html>
